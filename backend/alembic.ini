# Alembic migration configuration.
# The DATABASE URL is read from the environment in env.py (Settings.database_url),
# keeping a single source of truth with app/core/config.py.

[alembic]
script_location = alembic
prepend_sys_path = .
# URL is intentionally NOT set here — env.py pulls it from Settings.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
