[project]
name = "neuroplant-api"
version = "0.1.0"
description = "NeuroPlant AI — FastAPI backend for the agriculture AI platform"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    # Web framework
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
    "email-validator>=2.2",
    # Configuration & logging
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
    # Database (Postgres prod, SQLite dev fallback)
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "aiosqlite>=0.20",
    "alembic>=1.14",
    # Async task queue / cache
    "celery>=5.4",
    "redis>=5.2",
    # Auth & security
    "PyJWT>=2.10",
    "cryptography>=43.0",
    "argon2-cffi>=23.1",
    "slowapi>=0.1.9",
    # HTTP client & resilience
    "httpx>=0.27",
    "tenacity>=9.0",
    # Image handling / validation
    "Pillow>=10.4",
    # Object storage (S3 / Cloudflare R2 / MinIO)
    "boto3>=1.35",
    # Dates
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-python-dateutil>=2.9",
]

# Heavy / platform-specific AI dependencies are declared separately and
# installed in later milestones (M2+) to keep the base install light.
#   requirements-ml.txt: tensorflow, keras, opencv-python-headless, tf-keras

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --cov=app --cov-report=term-missing:skip-covered"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]
ignore = ["B008"]  # FastAPI Depends in defaults is idiomatic

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_unused_configs = true

# Third-party packages without type stubs.
[[tool.mypy.overrides]]
module = ["celery.*"]
ignore_missing_imports = true
